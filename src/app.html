<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" href="/fonts/Outfit-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lexend-v19-latin-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0c0908" />
    <script>
      (() => {
        const storageKey = "datapack-wiki-theme";
        let theme;

        try {
          const savedTheme = localStorage.getItem(storageKey);
          if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
        } catch {
          // Storage can be unavailable in privacy-restricted contexts.
        }

        if (!theme) theme = "dark";

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "light" ? "#e9e1da" : "#0c0908");
      })();
    </script>
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Datapack Wiki" />
    <meta
      name="keywords"
      content="datapacks, datapack wiki, datapack docs, minecraft datapacks, datapack help, datapack creation, dph" />
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
